name: Feature request
description: 建议一个新工具或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述场景，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 新增 tool？参数怎么设计？返回什么格式？
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案